<svg width="1200" height="140" viewBox="0 0 1200 140"
     xmlns="http://www.w3.org/2000/svg">

  <!-- subtle structure -->
  <line
    x1="38" y1="136"
    x2="1162" y2="136"
    stroke="#3A3A3A"
    stroke-width="2"
  />

  <!-- four accent blocks -->
  <rect x="40"  y="22" width="28" height="28" fill="#D8A94A"/>
  <rect x="75"  y="20" width="28" height="28" fill="#C9573F"/>
  <rect x="109" y="23" width="28" height="28" fill="#50758C"/>
  <rect x="144" y="21" width="28" height="28" fill="#C04A9B"/>

  <!-- name -->
  <text
    x="38"
    y="94"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-2.5"
    fill="#F2F0E8">
    ABHINAV
  </text>

  <!-- small personal descriptor -->
  <text
    x="40"
    y="116"
    font-family="monospace"
    font-size="12"
    fill="#8A8983">
    mathematics / computation / ideas
  </text>

  <!-- right-side index -->
  <text
    x="1160"
    y="38"
    text-anchor="end"
    font-family="monospace"
    font-size="12"
    fill="#8A8983">
    [01] MATH / CS / ML
  </text>

  <text
    x="1160"
    y="59"
    text-anchor="end"
    font-family="monospace"
    font-size="12"
    fill="#8A8983">
    [02] CURRENTLY
  </text>

  <text
    x="1160"
    y="80"
    text-anchor="end"
    font-family="monospace"
    font-size="12"
    fill="#8A8983">
    [03] PROJECTS / NOTES
  </text>

  <!-- tiny cursor -->
  <rect
    x="1160"
    y="103"
    width="7"
    height="13"
    fill="#C04A9B"
  />

  <!-- anime easter egg -->
  <text
    x="40"
    y="132"
    font-family="monospace"
    font-size="8"
    fill="#666661">
    WORLD LINE: 1.048596
  </text>

  <!-- accent status dots -->
  <circle cx="1100" cy="132" r="3" fill="#D8A94A"/>
  <circle cx="1116" cy="132" r="3" fill="#C9573F"/>
  <circle cx="1132" cy="132" r="3" fill="#50758C"/>
  <circle cx="1148" cy="132" r="3" fill="#C04A9B"/>

</svg>
